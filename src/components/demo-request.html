<section id="demo-request" class="demo-request">
  <div class="wrap">
    <div class="section-head">
      <div class="eb-text">Try it live</div>
      <h2 class="h">See it rescue a missed call</h2>
      <p>Enter your number and industry. We'll send you the same kind of text a missed caller would receive.</p>
    </div>

    <div class="dr-card" id="dr-card">
      <form id="dr-form" class="dr-form" novalidate>
        <div class="dr-row">
          <div class="field dr-field-phone">
            <label for="dr-phone">Your mobile number</label>
            <input id="dr-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
              placeholder="04XX XXX XXX" aria-describedby="dr-error" />
          </div>
          <div class="field dr-field-industry">
            <label id="dr-industry-label" for="dr-industry-btn">What industry are you in?</label>
            <div class="dr-combo" id="dr-combo">
              <button type="button" class="dr-combo-btn" id="dr-industry-btn"
                aria-haspopup="listbox" aria-expanded="false"
                aria-labelledby="dr-industry-label dr-combo-value">
                <span class="dr-combo-value is-placeholder" id="dr-combo-value">Select your industry</span>
                <svg class="dr-combo-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="dr-combo-panel" id="dr-combo-panel" hidden>
                <div class="dr-combo-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                  <input type="text" id="dr-combo-search" placeholder="Search industries…"
                    autocomplete="off" autocapitalize="off" spellcheck="false"
                    role="combobox" aria-expanded="true" aria-controls="dr-combo-list"
                    aria-autocomplete="list" aria-label="Search industries" />
                </div>
                <ul class="dr-combo-list" id="dr-combo-list" role="listbox" aria-labelledby="dr-industry-label"></ul>
                <div class="dr-combo-empty" id="dr-combo-empty" hidden>No matching industries</div>
              </div>
              <input type="hidden" name="industry" id="dr-industry" />
            </div>
          </div>
        </div>

        <div class="dr-error" id="dr-error" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary btn-lg dr-submit" id="dr-submit">Send me the demo</button>

        <p class="dr-privacy">We'll only use your number to send this demo text.</p>
      </form>

      <div class="dr-result" id="dr-result" role="status" aria-live="polite" hidden>
        <div class="dr-result-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h3 id="dr-result-msg"></h3>
      </div>
    </div>
  </div>
</section>
