<!-- ── JSON-LD structured data — PRIVACY POLICY ──────────────────────────────
     Metadata only. Same #organization @id as the homepage so every page
     resolves to one business entity.

     NOTE: dateModified is deliberately hard-coded, NOT stamped with the build
     date. This page states "Last updated: August 2026" in visible copy — an
     auto-bumped date would claim the policy changed every deploy. Bump the
     date below by hand whenever src/components/privacy.html changes, and keep
     it in step with the visible "Last updated" line.
──────────────────────────────────────────────────────────────────────────── -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "https://bury-digital.com/#organization",
      "name": "Bury Digital",
      "url": "https://bury-digital.com/",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Melbourne",
        "addressRegion": "VIC",
        "addressCountry": "AU"
      },
      "areaServed": { "@type": "Country", "name": "Australia" }
    },
    {
      "@type": "WebSite",
      "@id": "https://bury-digital.com/#website",
      "url": "https://bury-digital.com/",
      "name": "Bury Digital",
      "inLanguage": "en-AU",
      "publisher": { "@id": "https://bury-digital.com/#organization" }
    },
    {
      "@type": "WebPage",
      "@id": "https://bury-digital.com/privacy.html#webpage",
      "url": "https://bury-digital.com/privacy.html",
      "name": "Privacy Policy — Bury Digital",
      "description": "Bury Digital's privacy policy — how we collect, use, store, and disclose personal information under the Australian Privacy Act 1988.",
      "inLanguage": "en-AU",
      "isPartOf": { "@id": "https://bury-digital.com/#website" },
      "about": { "@id": "https://bury-digital.com/#organization" },
      "datePublished": "2026-04-20",
      "dateModified": "2026-08-06",
      "breadcrumb": { "@id": "https://bury-digital.com/privacy.html#breadcrumb" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://bury-digital.com/privacy.html#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://bury-digital.com/" },
        { "@type": "ListItem", "position": 2, "name": "Privacy Policy", "item": "https://bury-digital.com/privacy.html" }
      ]
    }
  ]
}
</script>
